name: Sync project READMEs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"   # every day, 6:17 AM Chicago time (winter) / 7:17 AM (summer)

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull READMEs from the lab repos
        env:
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          LAB_ORG: TootooniLab
        run: python3 scripts/sync_readmes.py
      - name: Commit changes and redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _data/readmes.json; then
            echo "No README changes."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add _data/readmes.json
          git commit -m "sync project READMEs from TootooniLab"
          git push
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
