 "adi-hypertension-therapeutic-inertia": "## Overview\nThis project investigates how neighborhood characteristics, measured through Area Deprivation Index (ADI), influences blood pressure control and therapeutic inertia in older adults with hypertension. This study analyzes data from primary care visits to understand the relationship between neighborhood disadvantage and hypertension management.\n\n## Objectives\nExamine the association between Area Deprivation Index (ADI) and uncontrolled blood pressure during primary care clinic visits\nInvestigate the relationship between ADI and therapeutic inertia during visits with uncontrolled blood pressure\nEvaluate how neighborhood characteristics influence hypertension management in older adults\n",
 "ai-medication-management-review": "\n",
 "caroli-ontology-llm-validation": "![CarolioImage](/assets/img/readmes/caroli-ontology-llm-validation/Graphical_Abstract3_2.png)\n<sup><sub>Liver image source: Asadi, S., et al. (2021). \"The Role of Mutations on Gene PKHD1 in Caroli Syndrome.\" Journal of Gastroenterology and Hepatology 7:1-6</sub></sup>\n\nWe present CaroliO, an ontology for Caroli's disease and syndrome, aimed at enhancing the diagnosis and treatment of these rare liver conditions. Our work addresses the pressing need for structured knowledge resources in the field of rare diseases, which often present significant diagnostic and treatment challenges due to limited information.\n\nWe developed our ontology in two versions: CaroliO VB, which is the Basic ontology; and CaroliO VA, the Applied Version, which includes more complex axioms i.e. closure axioms and axioms that indicate combinations of scenarios among symptoms, signs, treatments, and outcomes. The Basic Version follows the underlying Open World Assumption and is suitable for ontologists and future researches, while the Applied Version includes more complex axioms to better reflect real world decision making in diagnosis and choosing treatments for Caroli\u2019s disease and syndrome based on our current knowledge.\n\nMore information can be found at http://purl.obolibrary.org/obo/carolio.owl\n\n## Latest Release\n\n|    | OWL | Properties |\n| --- | --- | --- |\n| Applied | CaroliO_A.owl | CaroliO_A.properties |\n| Basic | CaroliO.owl | CaroliO.properties |\n",
 "ccmapper-chief-complaints": "This project seeks to extract concepts from Emergency Department (ED) Chief Complaints (CC) and map them to a structured list of CC Groups created by ED clinicians. When patients come to the ED, the CC is a short description of their reason for visit and is part of the earliest information collected for the encounter. We will first use three natural language processing (NLP) models to extract the concepts in the form of SNOMED-CT codes called SCTIDs. SNOMED-CT is a comprehensive and hierarchical clinical ontology. The three NLP models are cTAKES, cNAE, and a BERT-based model. We will also create the mappings of SCTIDs to CC groups in an SCTID Bank that takes advantage of the SNOMED-CT hierarchy to reduce manual work. Finally we will map the free text CC to the CC groups. These CC groups can be used on their own or be used in downstream processes such as resource allocation and clinical decision support.\n",
 "ehr-soft-token-fusion": "Making a patient's structured EHR record legible to a frozen LLM, by projecting\nit into a handful of soft tokens spliced into the prompt.\n\n**Status:** Active\n**Tags:** ehr-fusion, llm, representation-learning, mimic-iv, critical-care\n\n## Team\nSamie Tootooni (PI) \u00b7 Michael Saban\n\n## Abstract\nConventional fusion of structured EHR data with clinical text improves outcome\nprediction only marginally, is opaque, and never lets an LLM actually *reason*\nover the combined record ,  and tabular models like TabPFN already beat an LLM\nreading the serialized record. So beating them at prediction is not the goal.\nThe goal is to make the structured record **usable inside a frozen LLM**. A small\nprojector (~68M parameters) maps the structured feature vector into a few soft\ntokens spliced into a frozen Llama-3-8B-Instruct prompt, LLaVA-style, with only\nthe projector trained. Reconstruction ,  can the frozen model rebuild the record\nfrom those tokens? ,  is the feasibility probe, followed by multi-task\ninstruction tuning to test whether the record becomes genuinely addressable.\n\n## Methods Summary\nTwo stages, following LLaVA's staging rather than ELM's:\n\n- **Stage 1 (alignment):** train the projector only, LLM frozen, on\n  reconstruction. Multi-prompt training (50 sampled instruction phrasings) is\n  what makes the representation prompt-invariant; single-prompt training\n  collapses off its one prompt.\n- **Stage 2 (instruction tuning):** projector + LoRA, on a balanced multi-task\n  mix (reconstruction plus seven deterministic Tier-1 task types ,  field QA,\n  counting, presence, section, threshold, abnormality).\n\nEvaluation is generation-scored throughout, not proxied by a linear probe: field-\nlevel reconstruction metrics (measurement/medication/diagnosis/procedure F1,\ncategorical accuracy, numeric relative error), prompt-perturbation robustness,\nand per-task Tier-1 accuracy with tolerance-aware numeric and counting scores.\nCapacity comes from token count rather than projector depth.\n\nDetail in `docs/`: `soft_token_methods.md`, `reconstruction_hpo.md`,\n`numeric_loss.md`, `tier1_evaluator_audit.md`.\n\n## Key Results\n<!-- FILL: add 1-2 figures. They live in a gitignored results/, so add\n     deliberately, e.g.  git add -f results/presentation_figures/fig_promptset_comparison.png\n     Check each figure shows aggregate metrics, not per-patient rows. -->\n\n## Data Availability\n**MIMIC-IV, used under the PhysioNet credentialed-access Data Use Agreement.**\nNo patient data of any kind is in this repository, and none may be added ,  the\nDUA prohibits redistribution, and that extends to derivatives (hadm_ids,\nper-patient feature matrices, serialized records, pseudonotes, and model\ngenerations that quote them). `data/` is empty by design and `.gitignore` denies\ndata by default.\n\nTo reproduce, obtain MIMIC-IV v2.2 and MIMIC-IV-Note v2.2 directly from\nPhysioNet (https://physionet.org/content/mimiciv/) under your own credentialed\naccount and place them under `data/`. Contact msaban@luc.edu for the cohort\ndefinition and split files.\n\nBase model weights (Llama-3-8B-Instruct) are not included; point `--model-path`\nat your own local copy.\n\n## How to Reproduce\n```bash\nconda env create -f environment.yml\nconda activate ehr-soft-token-projection\n```\n\nThere is no single pipeline entry point; the stages run in order:\n\n```bash\n# 1. cohort + features (vendored from ehr-multimodal-fusion -- see Related projects)\nbash src/setup/lcd_pipeline.sh\npython src/setup/labels.py\npython src/data/create_structured_data.py\npython src/data/build_raw_structured_embeddings.py\n\n# 2. Stage 1 -- projector only, LLM frozen\npython src/train/sft_llama_soft_tokens.py --stage 1 --objective reconstruct \\\n    --n-soft 16 --multi-prompt-file data/recon_prompt_set.json\n\n# 3. reconstruction + robustness diagnostics\npython src/diagnostics/phase0/probe_reconstruct.py\npython src/diagnostics/phase0/promptset_eval_full.py\npython src/diagnostics/phase0/prompt_perturbation.py\n\n# 4. Stage 2 -- multi-task instruction tuning\npython src/data/build_tier1_tasks.py\npython src/data/build_stage2_mix.py\npython src/train/sft_llama_soft_tokens.py --stage 2 --objective multitask\n\n# 5. downstream mortality check\npython src/eval/mortality_eval.py --run-name <stage2_run>\n```\n\nSLURM submission scripts for the Valkyrie cluster are in `src/valkyrie/` and\n`src/cluster/`.\n\n## Related projects\n- [ehr-multimodal-fusion](https://github.com/TootooniLab/ehr-multimodal-fusion)\n  ,  the predecessor, and the reason this project exists: it established that\n  conventional fusion gives little and explains less. `src/setup/` and the\n  cohort/feature-engineering half of `src/data/` are **vendored from it** and\n  define the cohort; this project consumes their *outputs*, not their models.\n  Re-sync only if the cohort definition changes.\n\n## Related Publications\n<!-- FILL: St. Albert's Day 2026 poster; add citation + DOI once available -->\n\n## Contact\nmsaban@luc.edu\n",
