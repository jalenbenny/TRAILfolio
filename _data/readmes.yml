 "mediqa-synur-2026": "Hybrid retrieval and LLM verification system for open-source schema-guided clinical information extraction of synthetic nursing transcripts.\n\n**Status:** Completed\n**Tags:** nlp, llm, information-extraction, retrieval, nursing, shared-task\n\n> **Archival copy.** This repository is an archival copy of\n> [arsalanyaghoubi/Lakefront_AI_Ramblers-MEDIQA_SYNUR_2026](https://github.com/arsalanyaghoubi/Lakefront_AI_Ramblers-MEDIQA_SYNUR_2026),\n> taken with full history at upstream commit `b1521e9` (2026-02-10). No further\n> work is planned on either copy. The two are not kept in sync. After that\n> commit, this copy adds only a restructure to the lab template and\n> documentation. See docs/provenance.md.\n\n## Team\nTeam **Lakefront AI Ramblers**\n\n- Michael Saban (Loyola University Chicago)\n- Arsalan Yaghoubi\n- B. Eslami\n- S. Tootooni (Loyola University Chicago)\n- Dmitriy Dligach (Loyola University Chicago)\n\n## Abstract\nThis is the Lakefront AI Ramblers entry to the MEDIQA-SYNUR 2026 shared task:\nextracting structured nursing observations from synthetic nurse-patient\ntranscripts against a fixed schema of 193 observation types. The system combines\nlexical (BM25) and dense (BGE) retrieval to narrow the schema per transcript\nsegment. An open-source LLM then extracts the observations, and a separate LLM\nverification stage filters out hallucinated ones. It was built and evaluated on\nsynthetic nursing transcripts, but it should generalize to other clinical\ntranscripts given a curated schema. The work is published in the ClinicalNLP\nworkshop proceedings at LREC 2026.\n\n## Methods Summary\nThe pipeline has five stages, each a script in `src/` and run through `src/main.py`:\n\n1. **Segmentation.** Split each transcript into segments, either rule-based or LLM-based.\n2. **Schema RAG.** Retrieve the top 60 of the 193 schema rows per segment\n   using a hybrid of BAAI/bge-base-en-v1.5 and BM25 (\u03b1 = 0.6).\n3. **Extraction.** An LLM fills in values for the retrieved schema rows.\n   Models tried: GPT-4o / GPT-4o-mini, and Llama-3-8B and Llama-3.3-70B, both base and\n   LoRA-fine-tuned (SFT) on train or train+dev, with 4-bit quantization for 70B.\n4. **Self-consistency voting.** Majority or union vote over 3 sampled runs (T = 0.3).\n5. **Verification.** A second LLM pass (Llama-3.3-70B or GPT-4o-mini) drops\n   observations that the transcript doesn't support.\n\nScoring uses the organizers' official evaluation script\n(`src/mediqa_synur_eval_script.py`).\nThe 70B work ran on the Valkyrie GPU cluster under SLURM\n(`valkyrie_scripts/`). Setup and run steps are in\ndocs/setup.md.\n\n## Key Results\nDevelopment-set results (101 transcripts) from\n`results/outputs/comparison_results.csv`:\n\n| Configuration | P | R | F1 |\n|---|---|---|---|\n| GPT-4o + hybrid RAG + LLM segmentation (closed-model reference) | 84.12 | 84.96 | **84.54** |\n| **Llama-3.3-70B SFT + self-consistency voting + Llama-70B verification** (best open-source) | 84.21 | 77.48 | **80.70** |\n| Llama-3.3-70B SFT + hybrid RAG, 0-shot | 74.32 | 78.71 | 76.45 |\n| Llama-3.3-70B base + hybrid RAG, 0-shot | 70.48 | 78.49 | 74.27 |\n| Llama-3-8B base + hybrid RAG, 0-shot | 49.64 | 80.36 | 61.37 |\n\n- SFT plus voting plus verification brings the open-source 70B model from 74.3 to 80.7 F1,\n  within 4 points of GPT-4o. Most of that gain is precision: the verification pass cuts\n  hallucinated observations from 306 to 148.\n- Schema retrieval: hybrid BGE + BM25 reaches **99.4% recall@60**. Dense BGE alone\n  reaches 97.4% and BM25 alone 90.0%\n  (`results/outputs/retrieval_table.csv`).\n\nThe ten test-set submissions are in `results/submissions/`.\n<!-- TODO: official test-set score and leaderboard rank, from the organizers' results or the paper -->\n\n## Data Availability\nThe task data comes from the **MEDIQA-SYNUR 2026 shared task organizers**: the\nobservation schema plus train, dev, and test transcripts. It is **not\nredistributed here**. To obtain it, register for the shared task through the\norganizers and place the files in `data/raw/` as described in\ndocs/setup.md. `data/raw/` is gitignored.\n\nThe transcripts are **synthetic** nurse-patient dialogues. This project does not\nuse any real EHR or other clinical data, and no PHI is involved.\n\n**What this repo does contain that is derived from task data.** The run outputs\nunder `results/outputs/` are kept exactly as they were produced during the\nshared task:\n\n- per-transcript predictions, including the observation values extracted from transcripts;\n- the organizers' **gold observation labels** for the train and dev transcripts.\n  Each `predictions.json` embeds a `gold` field, and `reference.jsonl` holds\n  the train gold.\n\nThe ten test-set submission files in `results/submissions/` are kept as well.\nThese were all tracked in the upstream repository and remain in this copy's\nhistory. They were kept deliberately, as a record of the submitted system. The\ntranscripts themselves are never committed. Anyone reusing these outputs should\ncheck the shared task's data terms first.\n\nContact for questions about this repository: msaban@luc.edu.\n\n## How to Reproduce\n```bash\n# setup (Python 3.11)\nconda env create -f environment.yml && conda activate synur\n#   or: pip install -r requirements.txt\ncp .env.example .env              # add OPENAI_API_KEY for GPT runs / GPT verification\n# place the task data in data/raw/  (see docs/setup.md)\n\n# list pipeline stages\npython src/main.py --list\n\n# re-score a committed run with the official scorer (no task data needed);\n# reproduces GPT-4o-mini + BGE dense, train: P 82.75 / R 72.49 / F1 77.28\npython src/main.py evaluate \\\n  -r ../results/outputs/Meta-Llama-3-8B-Instruct/train_BGE_top60_enhanced/reference.jsonl \\\n  -p ../results/outputs/gpt-4o-mini/train_BGE_top60_enhanced/run_20260202_234051/submission.jsonl\n\n# full run (needs task data in data/raw/)\npython src/main.py run --data dev --model gpt-4o-mini \\\n  --embedding-model BAAI/bge-base-en-v1.5 --hybrid --hybrid-alpha 0.6 --top-n 60 --enhanced-prompts\n```\n\nStages run with `src/` as the working directory, so paths passed to them are\nresolved from `src/`. The exact 70B SFT, voting, and verification commands are in\nthe `valkyrie_scripts/*.sbatch` files.\n\n## Related Publications\n- M. Saban, A. Yaghoubi, B. Eslami, S. Tootooni, D. Dligach. <!-- TODO: exact paper title -->\n  In *Proceedings of the ClinicalNLP Workshop at LREC 2026*. <!-- TODO: pages, DOI / ACL Anthology link -->\n\n## Contact\nmsaban@luc.edu\n",
 "mimic-multimodal-fusion": "Does combining clinical notes with structured EHR data actually improve 30-day\npost-discharge mortality prediction, and can the resulting model be interpreted?\n\n**Status:** Active\n**Tags:** ehr-fusion, deep-learning, nlp, mimic-iv, critical-care\n\n## Team\nSamie Tootooni (PI) \u00b7 Michael Saban\n\n## Abstract\nPatients in MIMIC-IV have both a structured record (labs, vitals, demographics,\ndiagnoses, procedures) and free-text discharge notes, and the standard assumption\nis that fusing the two should beat either alone. This project tests that\nassumption directly for 30-day post-discharge mortality. It builds matched\nunimodal baselines ,  a hierarchical transformer over discharge notes, and\nTabPFN/XGBoost over engineered structured features ,  then compares late fusion\n(probability and logit averaging, stacking) and intermediate fusion (concat and\ngated MLP over learned projections) against them, with bootstrap confidence\nintervals, calibration analysis, and interaction-aware attribution. The headline\nfinding is a negative one that motivated a follow-on project: fusion buys very\nlittle over the stronger unimodal model, and what it does buy is hard to explain.\n\n## Methods Summary\nThree arms, all on the same cohort and splits:\n\n- **Text:** hierarchical transformer over chunked discharge summaries; also\n  BioClinical-ModernBERT embeddings + logistic regression.\n- **Structured:** engineered feature matrix (aggregated labs/vitals, ICD and\n  procedure codes, demographics) into TabPFN and XGBoost.\n- **Fusion:** late (weighted probability/logit averaging, LR stacking with and\n  without interaction terms) and intermediate (concat, gated MLP over projected\n  embeddings), with Optuna HPO over the intermediate-fusion architecture.\n\nEvaluation is threshold-free (AUROC/AUPRC) with bootstrap CIs and paired\nsignificance tests, plus calibration (Platt, isotonic, shape-restricted\npolynomial) and decision-curve analysis. Interpretability uses InterSHAP to\nseparate per-modality contribution from genuine cross-modal interaction.\n\nSee `docs/` for detail.\n\n## Key Results\n<!-- FILL: add 1-2 figures. They live in a gitignored results/, so add\n     deliberately, e.g.  git add -f results/roc_pr_curves.png\n     Check each figure shows aggregate metrics, not per-patient rows. -->\n\n## Data Availability\n**MIMIC-IV, used under the PhysioNet credentialed-access Data Use Agreement.**\nNo patient data of any kind is in this repository, and none may be added ,  the\nDUA prohibits redistribution, and that extends to derivatives (hadm_ids,\nper-patient feature matrices, pseudonotes, and model outputs that quote them).\n`data/` is empty by design and `.gitignore` denies data by default.\n\nTo reproduce, obtain MIMIC-IV v2.2 and MIMIC-IV-Note v2.2 directly from\nPhysioNet (https://physionet.org/content/mimiciv/) under your own credentialed\naccount and place them under `data/`. Contact msaban@luc.edu for the cohort\ndefinition and split files.\n\n## How to Reproduce\n```bash\nconda env create -f environment.yml\nconda activate ehr-multimodal-fusion\n```\n\nThere is no single pipeline entry point; the stages run in order:\n\n```bash\n# 1. cohort + features (shared with ehr-soft-token-projection)\nbash src/setup/lcd_pipeline.sh\npython src/setup/labels.py\npython src/data/create_structured_data.py\n\n# 2. unimodal baselines\nbash src/train/train_hier.sh\npython src/train/train_tabpfn.py\npython src/predict/predict_hier.py --split dev\n\n# 3. fusion\npython src/fusion/late_fusion.py\npython src/fusion/intermediate_fusion.py\n\n# 4. evaluation, calibration, interpretability\npython src/eval/evaluate.py\npython src/calibration/run_calibration_pipeline.py\npython src/eval/intershap_analysis.py\n```\n\n## Related projects\n- [ehr-soft-token-projection](https://github.com/TootooniLab/ehr-soft-token-projection)\n  ,  the follow-on. This project's finding that fusion is marginal and opaque is\n  what motivated projecting the structured record into an LLM's embedding space\n  instead. The two share the cohort and feature-engineering layer\n  (`src/setup/`, `src/data/`).\n\n## Related Publications\n<!-- FILL: AMIA 2026 poster; add citation + DOI once available -->\n\n## Contact\nmsaban@luc.edu\n",
 "stroke-codesign-paramedics": "## Overview\n\nThis repository supports the Paramedic Codesign and Trust study, a qualitative implementation study examining paramedic perceptions of a machine learning-based clinical decision support tool for prehospital stroke triage. The tool combines an XGBoost classifier for stroke detection and a Random Forest model for severity prediction, with SHAP waterfall plots providing model explanations.\n\nThe study is grounded in a codesign and human-in-the-loop framework\n\n## Objectives\n\n1. Characterize paramedic perceptions of trust, usability, and clinical relevance of the ML-based stroke triage tool.\n2. Evaluate paramedic diagnostic reasoning and model agreement across a strategically selected set of prehospital stroke cases (Clear Presentations, Stroke Mimics, Stroke Chameleons, and Discordant Cases).\n3. Identify barriers and facilitators to clinical adoption of AI-based decision support in EMS settings.\n4. Inform iterative codesign of the tool based on paramedic feedback.\n\n## Study Team\n\n- **Adnan Hossain** ,  MD Candidate, Loyola University Chicago Stritch School of Medicine\n- **Dr. Samie Tootooni** ,  Associate Professor, Health Informatics and Data Science; Associate Director, CHOIR\n-  **Michael Saban** ,  ML Model Development; PhD Student, Computer Science\n- **Dr. Mark Cichon** ,  Co-Investigator, Clinical Champion; Executive Director, Barbara and John Keeley Center for Emergency Medicine Education, Loyola University Medical Center\n- **Dr. Brenda Farlow** ,  Clinical Champion\n\n## Study Design\n\nSemi-structured interviews (45\u201360 minutes, conducted via Zoom or Microsoft Teams) with practicing paramedics, paired with a pre/post case-based scenario evaluation adapted from Liu et al.'s vancomycin CDSS framework. Participants review 12 cases drawn from a pool of 8,221 prehospital encounters, provide an independent clinical impression, and then evaluate the model's output. Thematic analysis follows Braun and Clarke's approach. Target enrollment is 12\u201316 participants.\n\n## Data\n\nParticipant data are collected and stored in REDCap in compliance with HIPAA requirements. This repository does not contain identifiable participant data.\n\n## Repository Structure\n\n- `code/` ,  Analysis scripts and model-related code\n- `docs/` ,  Study protocol, interview guides, and supporting documentation\n- `presentations/` ,  Slide decks and presentation materials\n\n## Status\n\nThis study is IRB-approved and actively enrolling. Manuscript development is underway.\n",
 "stroke-ems-narrative-nlp": "NLP over EMS ambulance narratives to identify what clinical information\nparamedics documented in the field.\n\n**Status:** Active\n**Tags:** stroke, nlp, ems, prehospital\n\n## Team\n\nM. Saban, S. Tootooni\n\nTootooni Lab, Loyola University Chicago.\n\n## Abstract\n\nThis project applies NLP to free-text EMS run narratives to detect which\nassessment findings were actually collected and recorded on scene or in the\nambulance. The extracted narrative content is intended to supplement the\nstructured EMS fields used by the triage models, giving a text + tabular view of\nthe same encounter. The question is whether a representation\nof narrative content adds discrimination, calibration, and interpretable\nclinical evidence beyond a strong structured-only baseline.\n\n## Methods Summary\n\nThe work has three components.\n\n1. **PHI-safe narrative profiling** -\n   (`src/assessment/`) characterizes narrative coverage,\n   length, post-handoff content, and clinical-signal prevalence without showing\n   record-level text. Term groups are in\n   `src/assessment/terms.py`.\n2. **Structured baseline + tabular foundation models** - the structured pipeline\n   from the published study, extended with a controlled\n   benchmark of TabPFN (v3.5-fast), TabFM, TabDPT, and TabICL across the\n   paper feature matrix and expanded feature sets\n   (`src/models/`).\n3. **Narrative fusion** - adding segmented pre-arrival narrative text to the\n   tabular models, beginning with TabPFN's built-in local text path. LLM WIP sits in\n   `notebooks/staged/`.\n\n\n## Key Results\n\n**Narrative richness.** Narratives were non-blank on all 14,935 profiled rows,\nmedian 816 characters (~204 tokens). Stroke focal-sign terms appeared in 27.6%\nof rows, onset/timing terms in 38.1%, metabolic/history terms in 40.0%. Among\nrows whose structured CPSS was null or normal, **52.9% still contained a\nfocal-sign or onset-timing term**, which suggests that narrative text\ncarries information the structured pipeline misses.\n\nHowever, the profile is row-weighted over the 14,935-row\nsource table rather than the deduplicated 8,221-case modeling cohort, and the\nterm matching does not address negation, temporality, or whether a mention\ndescribes the patient.\n\n**Structured baseline** (any-stroke, 2,466-case test set, 48 positives):\n\n| Model | Paper matrix AUROC | Expanded + CPSS AUROC | Expanded + CPSS AUPRC |\n|---|---:|---:|---:|\n| TabPFN-v3 | 0.862 [0.812, 0.911] | **0.874 [0.824, 0.921]** | 0.355 [0.210, 0.516] |\n| TabFM | 0.860 [0.801, 0.914] | 0.872 [0.817, 0.923] | **0.390 [0.243, 0.547]** |\n| TabDPT | 0.814 [0.736, 0.882] | 0.810 [0.745, 0.870] | 0.211 [0.107, 0.344] |\n| XGBoost (paper) | 0.843 [0.777, 0.904] | ,  | ,  |\n\nAdding the single CPSS feature moved AUPRC by +0.067 to +0.086 while barely\nchanging AUROC. CPSS improves ranking at the high-value end of the score\ndistribution. Bootstrap intervals are wide and overlapping, though.\n\nFigures in `results/figures/`, metrics in\n`results/metrics/`.\n\n## Data Availability\n\nThis project uses the same restricted EMS dataset as the lab's prehospital\nstroke triage work: ZOLL ePCR records (NEMSIS v3.4, Illinois EMS Region 8)\nlinked to Loyola University Medical Center hospital data. This repository holds code, annotation\nresources, documentation, and aggregate results only.\n\nReal data is on the IRB secure share and is accessible only if you're on the approved protocol.\n\n\n## How to Reproduce\n\n```bash\n# setup\nconda env create -f environment.yml      # or: conda-lock install -n stroketriage-env conda-lock.yml\nconda activate stroketriage-env\npip install -e .\n\n# point at the secure share (gitignored)\ncp src/config.local.example.yml src/config.local.yml\n\n# run\npython src/main.py --list                # show available pipelines\npython src/main.py paper                 # published structured pipeline\npython src/main.py profile --help        # PHI-safe narrative profiler\n```\n\nThe tabular foundation model benchmark needs a separate GPU environment and\nlocal checkpoints.\n\n## Related Publications\n\n- Code at [TootooniLab/stroke-triage-ml](https://github.com/TootooniLab/stroke-triage-ml).\n\n## Contact\n\nmsaban@luc.edu\n",
 "stroke-neds-cost-burden": "<!-- One-line summary of the project goes here. -->\n\n**Status:** Active <!-- Active / Completed / Archived -->\n**Tags:** tag1, tag2 <!-- lowercase, comma-separated. See _projects/ on the lab website for examples. -->\n\n## Team\nPI + contributors here.\n\n## Abstract\n2-4 sentences. What is this project and why does it matter.\n\n## Methods Summary\nBrief. Link to `docs/` for full detail.\n\n## Key Results\nPull in 1-2 figures from `results/` once you have them.\n\n## Data Availability\nWhere the real data lives (secure server, REDCap, etc.) and who to contact\nfor access. If this project uses EHR or other clinical data, state that\nexplicitly here even if `data/raw/` is empty in this repo.\n\n## How to Reproduce\n```bash\n# setup\npip install -r requirements.txt   # or: conda env create -f environment.yml\n\n# run\npython src/main.py\n```\n\n## Related Publications\n- Author et al., \"Title,\" Venue, Year. [link]\n\n## Contact\nname@luc.edu\n",
 "stroke-triage-ml": "Supervised models on routinely collected structured EMS encounter data that flag stroke and severe stroke at first patient contact.\n\n**Status:** Completed\n**Tags:** stroke, ems, prehospital, machine-learning, triage\n\n## Team\nM. Saban, G. Hiura, P. de la Pena, D. Heiferman, O. Akbilgic, M. Cichon, S. Tootooni (PI)\n\n## Abstract\nMachine learning models trained on routinely collected structured prehospital EMS records to predict stroke and severe stroke before hospital arrival. Performance is benchmarked against existing prehospital stroke assessment to assess its value for triage and routing decisions. Published in *Scientific Reports* (2026). This repository holds the modeling pipeline and evaluation code needed to reproduce the paper's results.\n\n## Methods Summary\n- **Data:** structured EMS encounter records linked to ED/hospital outcomes, with geocoded census block group Area Deprivation Index (ADI) and dispatch (nature-of-call, priority) codes. See `src/data/preprocessing.py`.\n- **Tasks:** two binary labels, *stroke* (any stroke vs. no stroke) and *severe* (severe stroke vs. non-severe/no stroke).\n- **Cohorts:** full cohort; EMS-suspected (CPSS performed); stroke-relevant (stroke and stroke mimics). A sensitivity analysis drops dispatch variables (`_nodisp`).\n- **Models:** random forest, XGBoost, and a shallow neural network, each tuned with Optuna (5-fold cross-validated ROC-AUC on the combined training and validation data) and evaluated on a stratified held-out test set (n = 2,466 full; 375 EMS-suspected; 772 stroke-relevant). Probabilities are calibrated post hoc: k-fold calibration for the tree models, attended temperature scaling for the neural network.\n- **Evaluation:** ROC-AUC and PR-AUC with confidence intervals, calibration, sensitivity/specificity operating-point trade-offs, confusion matrices, comparison against EMS CPSS and dispatch identification, and SHAP feature importance. A sub-analysis (`src/scripts/ed_measures_analysis.py`) examines ED NIHSS measures.\n\n## Key Results\n<!-- TODO: headline AUCs / operating-point metrics as reported in the published paper -->\n\nROC and precision-recall curves, full cohort (stroke and severe stroke):\n\n![Combined ROC/PR curves, full cohort](/assets/img/readmes/stroke-triage-ml/results/figures/fig3_combined_roc_pr_all.png)\n\nSHAP feature importance, full cohort (XGBoost for stroke, random forest for severe stroke):\n\n![SHAP summary, full cohort](/assets/img/readmes/stroke-triage-ml/results/figures/fig4_shap_summary_all.png)\n\nAll figures are in `results/figures/`; see `results/README.md`.\n\n## Data Availability\nThis project uses **identifiable clinical data**: prehospital EMS electronic patient care records (ZOLL RCSQL database extracts) linked to emergency department outcomes, and, for the ED measures sub-analysis, EHR flowsheet data. The data contain PHI, are held on the institution's secure research share under IRB approval, and **are not shared**. Nothing patient-identifiable is in this repository: `data/raw/` is empty and gitignored.\n\nThe repository contains code, configuration, tuned hyperparameters, figures, and the held-out-set evaluation bundles (labels and predicted probabilities, with no identifiers) used to produce the paper's figures and tables. The public ADI values come from the [Neighborhood Atlas](https://www.neighborhoodatlas.medicine.wisc.edu/).\n\nFor data access questions, contact msaban@luc.edu.\n\n## How to Reproduce\n\n```bash\n# setup\nconda-lock install -n stroketriage-env conda-lock.yml   # or: conda env create -f environment.yml\nconda activate stroketriage-env                         #     or: pip install -r requirements.txt\npip install -e .\n\n# run\npython src/main.py --list\npython src/main.py analysis\n```\n\nDetailed steps follow.\n\n### Prerequisites\n\nYou must have [Anaconda](https://www.anaconda.com/products/distribution) or [Miniconda](https://docs.conda.io/en/latest/miniconda.html) installed on your system to manage the Python environment and its dependencies.\n\n### Installation and Setup\n\n1.  **Clone the Repository**\n\n    ```bash\n    git clone https://github.com/TootooniLab/stroke-triage-ml.git\n    cd stroke-triage-ml\n    ```\n\n2.  **Create and Activate the Conda Environment**\n\n    Use the `conda-lock.yml` file to create a new Conda environment that contains all necessary packages. This command will create an environment named `stroketriage-env`.\n\n    ```bash\n    conda-lock install -n stroketriage-env conda-lock.yml\n    conda activate stroketriage-env\n    ```\n    *(Alternatively, you can use `environment.yml`: `conda env create -f environment.yml`, or `pip install -r requirements.txt` in a Python 3.12 environment.)*\n\n    **Important:** After activating the environment, you must set the `PYTHONHASHSEED` environment variable to ensure reproducibility.\n    ```bash\n    conda env config vars set PYTHONHASHSEED=0\n    conda deactivate\n    conda activate stroketriage-env\n    ```\n\n3.  **Install the Project in Editable Mode**\n\n    This step makes the `src` folder recognizable as a Python package, so all scripts and notebooks can use absolute imports (e.g., `from config.config import ...`) without any further setup.\n\n    From the root directory of the project, run:\n    ```bash\n    pip install -e .\n    ```\n    *(The `-e` stands for \"editable,\" meaning you can change the source code without needing to reinstall the package.)*\n\n4.  **Configure Data Paths**\n\n    Open the `src/config.yml` file in a text editor. You must modify the directory paths to point to the location of your datasets.\n\n    Update the following keys:\n    *   `split_dir`: Path to your directory containing data splits (train, validation, test sets).\n    *   `data_dir`: Path to your directory containing the raw data files.\n    *   `ph2`: Path to the main dataset file.\n    *   `geo`: Path to the file containing census codes for addresses.\n    *   `adi`: Path to the file containing Area Deprivation Index (ADI) values.\n    *   `fdc_desc`, `noc`, `prior`: Paths to tables from the SQL database (referencing ZOLL Data Systems RCSQL Data Dictionary).\n    *   `flowsheet_data_path`: Path to the ED flowsheet data (ED measures sub-analysis only).\n\n    **Note:** This codebase is designed for the specific datasets used in our publication. The `fdc_desc`, `noc`, and `prior` files correspond to specific SQL tables. While the code provides a framework for analysis, using it with different prehospital data may require modifications to account for schema differences. This repository is primarily intended for reproducibility of the published results.\n\n    Example:\n    ```yaml\n    # Directory for data splits.\n    split_dir: \"C:/Users/YourName/Documents/StrokeData/DataSplits/\"\n    # Directory for raw data.\n    data_dir: \"C:/Users/YourName/Documents/StrokeData/Raw/\"\n    ```\n\n### Running the Analysis\n\nOnce the setup is complete, you can run the analysis pipelines through the entry point:\n\n```bash\npython src/main.py --list          # list available pipelines\npython src/main.py analysis        # full training, evaluation, tables and figures\npython src/main.py ed-measures     # ED measures (NIHSS performance) sub-analysis\n```\n\nThese dispatch to the scripts in `src/scripts/`, which can also be run directly:\n```bash\npython src/scripts/run_analysis.py\npython src/scripts/ed_measures_analysis.py\n```\n\nBy default (`retune_models: false`, `retrain_models: true` in `src/config.yml`) models are retrained from the saved Optuna parameters in `results/tuning/` rather than re-tuned. Because the project is installed as a package, you can also directly run any other script or work interactively in a notebook, and all imports will resolve correctly.\n\n### Project Structure\n\n-   `src/`: All Python source code.\n    -   `main.py`: Entry point (`python src/main.py --list`).\n    -   `config.yml`: Project configuration (data paths, cohort, task, tuning flags, output directories).\n    -   `config/`: Configuration loading and path management.\n    -   `data/`: Data loading and preprocessing.\n    -   `models/`: Model training, tuning, and calibration logic.\n    -   `evaluation/`: Model performance evaluation and figure/table generation.\n    -   `pipelines/`: Training pipeline and preliminary/descriptive analysis.\n    -   `scripts/`: Executable analysis scripts (`run_analysis.py`, `ed_measures_analysis.py`).\n-   `results/`: Generated outputs (see `results/README.md`).\n    -   `figures/`: Generated plots and figures (`figure_dir`).\n    -   `metrics/`: Model evaluation results and tables (`output_dir`).\n    -   `tuning/`: Optuna best hyperparameters (`model_dir`).\n-   `data/`: `raw/` is gitignored and never committed; `processed/` is for synthetic or de-identified samples only.\n-   `docs/`, `notebooks/`: Supporting documentation and exploratory work.\n-   `conda-lock.yml`: Lock file for exact environment reproduction.\n-   `environment.yml`, `requirements.txt`: Conda environment file and pip requirements.\n-   `setup.py`: Makes the project installable as a Python package.\n\n## Related Publications\n- Saban M, Hiura G, de la Pena P, Heiferman D, Akbilgic O, Cichon M, Tootooni S. <!-- TODO: exact title --> *Scientific Reports*, 2026. <!-- TODO: DOI link -->\n\n## Contact\nmsaban@luc.edu\n"
}
